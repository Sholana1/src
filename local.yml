services:
  traefik:
    container_name: traefik
    image: docker.io/traefik:v3.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend/docker/local/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - genshow_local_network
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80

  postgres:
    build:
      context: .
      dockerfile: ./backend/docker/local/postgres/Dockerfile
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.envs/.env.local
    networks:
      - genshow_local_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api: &api
    build:
      context: .
      dockerfile: ./backend/docker/local/fastapi/Dockerfile
    container_name: api
    volumes:
      - .:/src
      - ./backend/app/logs:/src/backend/app/logs
    ports:
      - "8000:8000"
    env_file:
      - ./.envs/.env.local
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    command: /start.sh
    networks:
      - genshow_local_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.service=api-service"
      - "traefik.http.services.api-service.loadbalancer.server.port=8000"
      - "traefik.http.services.api-service.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api-service.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.api-service.loadbalancer.healthcheck.timeout=10s"

  mailpit:
    image: docker.io/axllent/mailpit:v1.20.3
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - genshow_mailpit_data:/data
    environment:
      MP_MAX_MESSAGE_SIZE: "10485760"
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - genshow_local_network

  redis:
    image: docker.io/redis:7.0-alpine
    container_name: redis
    command: redis-server --appendonly yes
    networks:
      - genshow_local_network

  rabbitmq:
    image: docker.io/rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - genshow_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - genshow_local_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.routers.rabbitmq.service=rabbitmq-service"
      - "traefik.http.services.rabbitmq-service.loadbalancer.server.port=15672"

  celeryworker:
    <<: *api
    container_name: celeryworker
    ports: []
    volumes: []       # Workers don't need your full source tree mounted
    command: /start-celeryworker.sh
    depends_on:
      - redis
      - rabbitmq

  flower:
    <<: *api
    container_name: flower
    ports:
      - "5555:5555"
    volumes:
      - genshow_flower_data:/data
    command: /start-flower.sh
    depends_on:
      - redis
      - rabbitmq
    environment:
      CELERY_FLOWER_USER: admin
      CELERY_FLOWER_PASSWORD: admin123
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flower.entrypoints=web"
      - "traefik.http.routers.flower.rule=Host(`flower.localhost`)"
      - "traefik.http.routers.flower.service=flower-service"
      - "traefik.http.services.flower-service.loadbalancer.server.port=5555"

  celerybeat:
    <<: *api
    container_name: celerybeat
    ports: []
    volumes: []
    command: /start-celerybeat.sh
    depends_on:
      - redis
      - rabbitmq

networks:
  genshow_local_network:
    external: true

volumes:
  postgres_data:
  genshow_mailpit_data:
  genshow_rabbitmq_data:
  genshow_flower_data:
